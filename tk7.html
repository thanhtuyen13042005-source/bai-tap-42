<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài TK7 - Tạo chuỗi ngẫu nhiên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <a href="42.html" class="btn btn-secondary mb-3">&larr; Quay lại Trang chủ</a>
        <div class="card shadow p-4">
            <h3 class="text-primary mb-3">Bài TK7: Tạo chuỗi ngẫu nhiên</h3>
            
            <div class="mb-3">
                <label class="form-label">Nhập độ dài chuỗi:</label>
                <input type="number" id="lengthInput" class="form-control" value="10" min="1" max="50">
            </div>
            <button class="btn btn-primary w-100 mb-3" onclick="generateString()">Tạo Chuỗi</button>
            
            <div class="mb-3">
                <label class="form-label">Kết quả:</label>
                <input type="text" id="resultOutput" class="form-control fw-bold text-success" readonly>
            </div>
        </div>
    </div>

    <script>
        function generateString() {
            const length = document.getElementById('lengthInput').value;
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            document.getElementById('resultOutput').value = result;
        }
    </script>
</body>
</html>
