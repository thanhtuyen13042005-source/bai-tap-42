<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài TK8 - Chuyển đổi màu Hex sang RGB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <a href="42.html" class="btn btn-secondary mb-3">&larr; Quay lại Trang chủ</a>
        <div class="card shadow p-4">
            <h3 class="text-primary mb-3">Bài TK8: Chuyển đổi Hex sang RGB</h3>
            
            <div class="mb-3">
                <label class="form-label">Chọn hoặc nhập mã Hex:</label>
                <div class="input-group">
                    <input type="color" id="colorPicker" class="form-control form-control-color" value="#0d6efd" style="max-width: 60px;" oninput="hexToRgb(this.value)">
                    <input type="text" id="hexInput" class="form-control" value="#0d6efd" oninput="hexToRgb(this.value)">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Kết quả RGB:</label>
                <input type="text" id="rgbOutput" class="form-control fw-bold text-danger" value="rgb(13, 110, 253)" readonly>
            </div>
            
            <div id="colorBox" class="w-100 rounded" style="height: 80px; background-color: #0d6efd; border: 1px solid #ccc;"></div>
        </div>
    </div>

    <script>
        function hexToRgb(hex) {
            document.getElementById('hexInput').value = hex;
            document.getElementById('colorPicker').value = hex;
            
            let c;
            if(/^#?[a-fA-F0-9]{6}$/.test(hex)){
                c = hex.replace('#','');
                let r = parseInt(c.substring(0,2), 16);
                let g = parseInt(c.substring(2,4), 16);
                let b = parseInt(c.substring(4,6), 16);
                let rgbVal = `rgb(${r}, ${g}, ${b})`;
                document.getElementById('rgbOutput').value = rgbVal;
                document.getElementById('colorBox').style.backgroundColor = rgbVal;
            }
        }
    </script>
</body>
</html>
