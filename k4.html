<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài K4 - Validate Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <a href="42.html" class="btn btn-secondary mb-3">&larr; Quay lại Trang chủ</a>
        <div class="card shadow p-4">
            <h3 class="text-success mb-3">Bài K4: Validate Form Đăng Nhập</h3>
            <form id="loginForm" onsubmit="return validateForm(event)">
                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="text" id="emailInput" class="form-control" placeholder="nguyen@gmail.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu (ít nhất 6 ký tự):</label>
                    <input type="password" id="passInput" class="form-control">
                </div>
                <button type="submit" class="btn btn-success w-100">Đăng Nhập</button>
            </form>
            <div id="alertMsg" class="mt-3"></div>
        </div>
    </div>

    <script>
        function validateForm(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passInput').value;
            const alertMsg = document.getElementById('alertMsg');

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(email)) {
                alertMsg.innerHTML = '<div class="alert alert-danger">Email không hợp lệ!</div>';
            } else if (pass.length < 6) {
                alertMsg.innerHTML = '<div class="alert alert-warning">Mật khẩu phải có ít nhất 6 ký tự!</div>';
            } else {
                alertMsg.innerHTML = '<div class="alert alert-success">Đăng nhập thành công!</div>';
            }
        }
    </script>
</body>
</html>
