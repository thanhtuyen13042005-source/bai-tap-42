<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài K6 - Bộ Đếm Ngược</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <a href="42.html" class="btn btn-secondary mb-3">&larr; Quay lại Trang chủ</a>
        <div class="card shadow p-4 text-center">
            <h3 class="text-success mb-3">Bài K6: Bộ Đếm Ngược</h3>
            <div class="mb-3">
                <input type="number" id="timeInput" class="form-control text-center" value="10" min="1" placeholder="Nhập số giây">
            </div>
            <button class="btn btn-success mb-3" onclick="startTimer()">Bắt Đầu Đếm Ngược</button>
            
            <div class="display-3 fw-bold text-danger my-3" id="timerDisplay">10</div>
        </div>
    </div>

    <script>
        let intervalId;
        function startTimer() {
            clearInterval(intervalId);
            let time = parseInt(document.getElementById('timeInput').value);
            const display = document.getElementById('timerDisplay');
            
            if (isNaN(time) || time <= 0) {
                alert('Vui lòng nhập số giây lớn hơn 0!');
                return;
            }

            display.textContent = time;
            intervalId = setInterval(() => {
                time--;
                display.textContent = time;
                if (time <= 0) {
                    clearInterval(intervalId);
                    alert('Hết giờ!');
                }
            }, 1000);
        }
    </script>
</body>
</html>
