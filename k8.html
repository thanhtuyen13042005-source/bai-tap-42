<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài K8 - Danh Sách Công Việc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .done { text-decoration: line-through; color: #888; }
    </style>
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <a href="42.html" class="btn btn-secondary mb-3">&larr; Quay lại Trang chủ</a>
        <div class="card shadow p-4">
            <h3 class="text-success mb-3">Bài K8: To-Do List (Quản lý công việc)</h3>
            
            <div class="input-group mb-3">
                <input type="text" id="taskInput" class="form-control" placeholder="Nhập công việc mới...">
                <button class="btn btn-success" onclick="addTask()">Thêm</button>
            </div>

            <ul class="list-group" id="taskList">
                <!-- Nội dung danh sách sẽ thêm vào đây -->
            </ul>
        </div>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;

            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <span onclick="toggleTask(this)" style="cursor:pointer;">${text}</span>
                <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Xóa</button>
            `;

            document.getElementById('taskList').appendChild(li);
            input.value = '';
        }

        function toggleTask(element) {
            element.classList.toggle('done');
        }
    </script>
</body>
</html>
